
name: Python evaluation tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        mode: [baseline, ai_assisted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Linux dependency lockfile
        run: |
          python -m pip install pip-tools
          python -m piptools compile --generate-hashes --output-file=requirements-lock.txt requirements.txt
      - name: Upload dependency lockfile
        uses: actions/upload-artifact@v4
        if: matrix.mode == 'baseline'
        with:
          name: requirements-lock
          path: requirements-lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-lock.txt

      - name: Test implementation
        env:
          EVAL_MODE: ${{ matrix.mode }}
        run: |
          python -m pytest tests -q --cov=calculator --cov-report=term-missing
